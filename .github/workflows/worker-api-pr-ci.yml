name: worker-api-pr-ci

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "services/worker-api/**"
      - ".github/workflows/worker-api-pr-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-api-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-api-quality:
    name: Types, lint, test, and dry-run bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/worker-api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: paca_worker_test
          POSTGRES_PASSWORD: paca_test
          POSTGRES_USER: paca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paca_test -d paca_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-worker-web-${{ hashFiles('services/worker-api/bun.lock', 'apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-worker-web-

      - name: Install Worker dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Build internal React assets
        working-directory: apps/web
        run: ./node_modules/.bin/tsc -b && VITE_INTERNAL_PREVIEW=true ./node_modules/.bin/vite build

      - name: Verify generated Worker types
        run: bun run types:check

      - name: Verify Drizzle migrations
        run: bun run db:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Apply migrations, run repository contracts, and exercise recovery
        env:
          PACA_TEST_DATABASE_URL: postgresql://paca_test:paca_test@127.0.0.1:5432/paca_worker_test
        run: bun run test:postgres

      - name: Build deployment bundle
        run: bun run deploy:dry-run
